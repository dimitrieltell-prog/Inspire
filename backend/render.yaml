services:
  - type: web
    name: inspire-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_MONGO
        value: "true"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: inspire
      - key: USE_OPENAI
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: ARIA_FREE_DAILY_LIMIT
        value: "5"
      - key: CORS_ORIGINS
        value: "https://inspirerealexperiences.com,https://www.inspirerealexperiences.com"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        value: "https://www.inspirerealexperiences.com"
      - key: ADMIN_KEY
        sync: false
