<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <title>Inspire — A quieter kind of social</title>

    <!-- Link previews (iMessage, Instagram, WhatsApp, Slack, X...). Without
         these, a shared link showed the title only and no image, because
         scrapers fall back to <title> but will not guess at an image.
         og:image MUST be an absolute URL -- a relative path is silently
         ignored by every scraper. PNG rather than the existing SVGs, which
         most scrapers refuse to render. 1200x630 is the size they expect.
         Uses the www host on purpose: the apex 308-redirects to www, and
         scrapers commonly will not follow a redirect for og:image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inspire" />
    <meta property="og:url" content="https://www.inspirerealexperiences.com/" />
    <meta property="og:title" content="Inspire — A quieter kind of social" />
    <meta property="og:description" content="A space to be real. Share what actually happened, openly or anonymously — and get support instead of likes." />
    <meta property="og:image" content="https://www.inspirerealexperiences.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Inspire" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Inspire — A quieter kind of social" />
    <meta name="twitter:description" content="A space to be real. Share what actually happened, openly or anonymously — and get support instead of likes." />
    <meta name="twitter:image" content="https://www.inspirerealexperiences.com/og-image.png" />

    <meta name="description" content="A space to be real. Share what actually happened, openly or anonymously — and get support instead of likes." />
    <meta name="theme-color" content="#131A33" />
    <script>
      // Stamp the theme on <html> before anything paints, so a returning
      // visitor doesn't see a flash of the wrong theme while React boots.
      // ThemeContext.jsx mirrors the resolved preference into this same
      // localStorage key on every change, so this stays in sync with the
      // account setting without needing to wait on a network request here.
      (function () {
        try {
          var stored = localStorage.getItem('inspire_theme_preference')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
