<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <title>Inspire — A quieter kind of social</title>
    <script>
      // Stamp the theme on <html> before anything paints, so a returning
      // visitor doesn't see a flash of the wrong theme while React boots.
      // ThemeContext.jsx mirrors the resolved preference into this same
      // localStorage key on every change, so this stays in sync with the
      // account setting without needing to wait on a network request here.
      (function () {
        try {
          var stored = localStorage.getItem('inspire_theme_preference')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
